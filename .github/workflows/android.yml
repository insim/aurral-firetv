name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Lint
        run: ./gradlew lintDebug --stacktrace 2>&1 | tee -a build.log

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aurral-tv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Keeps the compiler diagnostics readable without authenticated access to
      # the job logs: the interesting lines are pushed to a throwaway branch.
      - name: Publish failure log
        if: failure()
        run: |
          mkdir -p .ci
          grep -E '^e: |error:|FAILURE:|What went wrong|> Task .* FAILED|Could not resolve' build.log \
            | head -300 > .ci/last-failure.log || true
          if [ ! -s .ci/last-failure.log ]; then
            tail -n 400 build.log > .ci/last-failure.log
          fi
          git config user.name "ci"
          git config user.email "ci@local"
          git checkout -B ci-logs
          git add -f .ci/last-failure.log
          git commit -m "CI failure log for ${GITHUB_SHA}" || true
          git push -f origin ci-logs

  release:
    name: Signed release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for the release
        run: cp app/build/outputs/apk/release/app-release.apk "aurral-tv-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: aurral-tv-*.apk
          generate_release_notes: true
